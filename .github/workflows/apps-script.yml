# Opcional: sube apps-script/ al proyecto de Apps Script de la hoja y publica
# una nueva versión en la MISMA implementación (la URL /exec no cambia).
# Solo corre si configuraste en GitHub (Settings → Secrets and variables → Actions):
#   Secret   CLASPRC_JSON    contenido de ~/.clasprc.json tras `clasp login`
#   Variable SCRIPT_ID       ID del proyecto de Apps Script
#   Variable DEPLOYMENT_ID   ID de la implementación web (Implementar → Administrar implementaciones)
name: Publicar servidor

on:
  push:
    branches: [main]
    paths: ['apps-script/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ vars.SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ vars.DEPLOYMENT_ID }}
    steps:
      - name: Revisar configuración
        id: cfg
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "Falta CLASPRC_JSON, SCRIPT_ID o DEPLOYMENT_ID; no se publica el servidor."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.listo == 'si'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.listo == 'si'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: steps.cfg.outputs.listo == 'si'
        name: Subir y publicar
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json
          clasp push --force
          clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub ${GITHUB_SHA::7}"
